name: SZB Salary Pack integrity

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Проверка лендинга и PDF
    runs-on: ubuntu-24.04
    steps:
      - name: Скачать файлы репозитория
        uses: actions/checkout@v5

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Проверить HTML, ссылки, PDF и JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          import subprocess, tempfile, re, sys

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids, self.anchors, self.scripts = [], [], []
                  self.in_script, self.parts = False, []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get('id'): self.ids.append(a['id'])
                  if tag == 'a' and (a.get('href') or '').startswith('#'):
                      self.anchors.append(a['href'][1:])
                  if tag == 'script' and not a.get('src'):
                      self.in_script, self.parts = True, []
              def handle_data(self, data):
                  if self.in_script: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      self.scripts.append(''.join(self.parts))
                      self.in_script = False

          html_file = Path('index.html')
          pdf_file = Path('paket-prodavca-zp.pdf')
          errors = []
          if not html_file.is_file():
              sys.exit('ОШИБКА: index.html не найден в корне репозитория')
          if not pdf_file.is_file():
              sys.exit('ОШИБКА: paket-prodavca-zp.pdf не найден в корне репозитория')
          html = html_file.read_text(encoding='utf-8')
          p = Audit(); p.feed(html)
          duplicates = [v for v, n in Counter(p.ids).items() if n > 1]
          missing = sorted(set(a for a in p.anchors if a and a not in p.ids))
          if duplicates: errors.append('Дублирующиеся id: ' + ', '.join(duplicates[:15]))
          if missing: errors.append('Битые внутренние якоря: ' + ', '.join(missing[:15]))
          if len(re.findall(r'<section\b[^>]*class="[^"]*\bview\b',html)) != 26:
              errors.append('Число разделов изменилось (ожидается 26)')
          if html.count('class="sp-micro ') != 25:
              errors.append('Число мини-баннеров изменилось (ожидается 25)')
          if 'id="emp-mobile"' not in html or 'class="sm-offer' not in html:
              errors.append('Не найден основной баннер СберМобайл')
          if 'paket-prodavca-zp.pdf' not in html:
              errors.append('В HTML нет ссылки на PDF')
          if not pdf_file.read_bytes().startswith(b'%PDF-'):
              errors.append('PDF повреждён или неверный формат')
          if re.search(r'location\.search\.match\(/\[\?&\]today', html):
              errors.append('Обнаружена запрещённая подмена даты ?today=')
          for i, js in enumerate(p.scripts, 1):
              with tempfile.NamedTemporaryFile(mode='w', encoding='utf-8', suffix='.js') as f:
                  f.write(js); f.flush()
                  r = subprocess.run(['node', '--check', f.name], capture_output=True, text=True)
                  if r.returncode: errors.append(f'JavaScript #{i}: {r.stderr.strip()[:200]}')
          print(f'Проверено: {len(p.anchors)} ссылок, {len(p.scripts)} JS-блоков, 26 разделов, 25 баннеров')
          if errors:
              for e in errors: print('ОШИБКА:', e, file=sys.stderr)
              sys.exit(1)
          print('Статическая проверка пройдена')
          PY

      - name: Установить браузер для проверки
