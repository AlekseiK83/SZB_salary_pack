name: SZB Salary Pack integrity

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Проверка HTML, PDF и браузера
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить файлы
        uses: actions/checkout@v5
      - name: Настроить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Настроить Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Установить средства проверки
        run: python -m pip install 'pypdf>=5,<8' playwright==1.57.0
      - name: Проверить HTML и PDF
        shell: bash
        run: |
          python -c '
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          from pypdf import PdfReader
          from datetime import date
          import re, sys, subprocess, tempfile

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids, self.anchors, self.scripts = [], [], []
                  self.active = False
                  self.buffer = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get("id"):
                      self.ids.append(a["id"])
                  if tag == "a" and (a.get("href") or "").startswith("#"):
                      self.anchors.append(a["href"][1:])
                  if tag == "script" and not a.get("src"):
                      self.active, self.buffer = True, []
              def handle_data(self, data):
                  if self.active:
                      self.buffer.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.active:
                      self.scripts.append("".join(self.buffer))
                      self.active = False

          html_path, pdf_path = Path("index.html"), Path("paket-prodavca-zp.pdf")
          assert html_path.is_file() and pdf_path.is_file(), "Нужны index.html и paket-prodavca-zp.pdf в корне main"
          html = html_path.read_text(encoding="utf-8")
          a = Audit()
          a.feed(html)
          errors = []
          ids = set(a.ids)
          missing = sorted({x for x in a.anchors if x and x not in ids})
          duplicates = [x for x, n in Counter(a.ids).items() if n > 1]
          if missing: errors.append("Отсутствующие якоря: " + ", ".join(missing[:10]))
          if duplicates: errors.append("Повторяющиеся id: " + ", ".join(duplicates[:10]))
          if len(re.findall(r"<section\b[^>]*class=\"[^\"]*\bview\b", html)) != 26:
              errors.append("Должно быть 26 разделов")
          if html.count("class=\"sp-micro ") != 25:
              errors.append("Должно быть 25 баннеров")
          if "paket-prodavca-zp.pdf" not in html:
              errors.append("Отсутствует ссылка на PDF")
          if re.search(r"location\.search\.match\(/\[\?&\]today", html):
              errors.append("Обнаружена подмена даты через ?today=")
          for i, js in enumerate(a.scripts, 1):
              with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8") as f:
                  f.write(js)
                  f.flush()
                  result = subprocess.run(["node", "--check", f.name], capture_output=True, text=True)
              if result.returncode:
                  errors.append(f"Ошибка JS #{i}: {result.stderr[:160]}")
          try:
              pdf = PdfReader(str(pdf_path))
              content = " ".join(page.extract_text() or "" for page in pdf.pages)
              annotations = sum(len(page.get("/Annots") or []) for page in pdf.pages)
              if len(pdf.pages) != 4:
                  errors.append("PDF должен содержать 4 страницы")
              if "Редакция 24.11.2026" not in content:
                  errors.append("PDF не соответствует согласованной редакции 24.11.2026")
              if annotations < 4:
                  errors.append("PDF: менее 4 активных ссылок")
          except Exception as exc:
              errors.append("PDF не открывается: " + str(exc))
          print(f"HTML: {len(a.anchors)} якорей, {len(a.scripts)} JS-блоков; PDF: {pdf_path.stat().st_size} байт")
          for msg in errors:
              print("ОШИБКА:", msg, file=sys.stderr)
          if errors:
              sys.exit(1)
          print("Статическая проверка пройдена")
          '
      - name: Установить Chromium
        run: python -m playwright install --with-deps chromium
      - name: Проверить интерфейс Chromium
        shell: bash
        run: |
          python -c '
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import shutil

          html = Path("index.html").read_text(encoding="utf-8")
          with sync_playwright() as p:
              binary = shutil.which("chromium")
              options = {"executable_path": binary} if binary else {}
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"], **options)
              passed = 0
              for width in (320, 390, 768, 1440):
                  page = browser.new_page(viewport={"width": width, "height": 850})
                  js_errors = []
                  page.on("pageerror", lambda err: js_errors.append(str(err)))
                  page.set_content(html, wait_until="load")
                  for section in ("biz-money", "biz-requisites", "emp-mobile", "pick", "calc", "objections"):
                      page.evaluate("(v) => { location.hash = v; window.dispatchEvent(new Event(\"hashchange\")); }", section)
                      assert "on" in (page.locator("#" + section).get_attribute("class") or "").split(), f"Раздел {section}, экран {width}"
                      passed += 1
                  page.evaluate("location.hash = \"pick\"; window.dispatchEvent(new Event(\"hashchange\"));")
                  assert page.locator("#onepage .op-top li").count() == 7, f"ТОП-фич, экран {width}"
                  assert not any("Sber API" in x for x in page.locator("#onepage .op-top .op-t").all_inner_texts())
                  page.locator("#f-api").evaluate("(el) => { el.checked = true; el.dispatchEvent(new Event(\"change\", {bubbles:true})); }")
                  assert page.locator("#onepage .op-top li").count() == 7
                  page.locator("#f-api").evaluate("(el) => { el.checked = false; el.dispatchEvent(new Event(\"change\", {bubbles:true})); }")
                  passed += 3
                  page.evaluate("location.hash = \"calc\"; window.dispatchEvent(new Event(\"hashchange\"));")
                  page.locator("#cl-n").fill("0")
                  assert "Проверьте поля" in page.locator("#calc-out").inner_text()
                  page.locator("#cl-n").fill("100")
                  page.locator("#szb-scenario-mode").select_option("potential")
                  assert "Проверьте поля" in page.locator("#calc-out").inner_text()
                  page.locator("#szb-scenario-share").fill("40")
                  assert "бонусов СберСпасибо" in page.locator("#calc-out").inner_text()
                  passed += 3
                  page.evaluate("window.scrollTo(0, 0)")
                  page.locator("#srch-open").scroll_into_view_if_needed()
                  page.locator("#srch-open").click(timeout=10000)
                  page.locator(".sr-wrap").wait_for(state="visible", timeout=5000)
                  page.wait_for_function("document.activeElement?.id === \"sr-q\"", timeout=5000)
                  page.keyboard.press("Shift+Tab")
                  assert page.evaluate("document.activeElement.id") == "sr-x", f"Shift+Tab, экран {width}"
                  page.keyboard.press("Tab")
                  assert page.evaluate("document.activeElement.id") == "sr-q", f"Tab, экран {width}"
                  page.keyboard.press("Escape")
                  assert page.evaluate("document.activeElement.id") == "srch-open", f"Escape, экран {width}"
                  passed += 5
                  assert not js_errors, f"Ошибки JS: {js_errors}"
                  assert not page.evaluate("document.documentElement.scrollWidth > innerWidth"), f"Горизонтальная прокрутка {width}"
                  passed += 2
                  page.close()
              browser.close()
          print(f"Chromium: {passed} проверок пройдено")
          '
      - name: Подтвердить завершение полного workflow
        run: echo "SZB_WORKFLOW_COMPLETE_2026_11_24"
