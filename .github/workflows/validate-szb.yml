name: SZB Salary Pack integrity
on:
  push:
    branches: ['main', 'master']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_static.py --self-test
      - run: python scripts/test_links.py
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/smoke_browser.py
  weekly-link-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-links-report
          path: reports/link_status.json
